services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: snapscale
      POSTGRES_PASSWORD: snapscale
      POSTGRES_DB: snapscale
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapscale"]
      interval: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8025/api/v2/messages || exit 1"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
